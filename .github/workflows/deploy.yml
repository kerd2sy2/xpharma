name: 🚀 XPharma Auto Deploy CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: 🌐 Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 [1/4] Initializing environment on VPS..."
            
            # Load environment paths
            [ -f "$HOME/.profile" ] && source "$HOME/.profile" 2>/dev/null || true
            [ -f "$HOME/.bashrc" ] && source "$HOME/.bashrc" 2>/dev/null || true
            [ -s "$HOME/.nvm/nvm.sh" ] && source "$HOME/.nvm/nvm.sh" 2>/dev/null || true
            [ -s "/root/.nvm/nvm.sh" ] && source "/root/.nvm/nvm.sh" 2>/dev/null || true
            export PATH=$PATH:/usr/local/go/bin:/usr/local/bin:/usr/bin:/bin:/snap/bin:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:/root/.nvm/versions/node/$(ls /root/.nvm/versions/node 2>/dev/null | tail -n 1)/bin

            # Detect directory
            TARGET_DIR=""
            if [ -d "/var/www/xpharma/repo/web-admin" ]; then
              TARGET_DIR="/var/www/xpharma/repo"
            elif [ -d "/var/www/xpharma/web-admin" ]; then
              TARGET_DIR="/var/www/xpharma"
            elif [ -d "$HOME/xpharma/web-admin" ]; then
              TARGET_DIR="$HOME/xpharma"
            elif [ -d "/root/xpharma/web-admin" ]; then
              TARGET_DIR="/root/xpharma"
            else
              FOUND_DIR=$(find /var/www /root /home -name "web-admin" -type d 2>/dev/null | head -n 1)
              if [ -n "$FOUND_DIR" ]; then
                TARGET_DIR=$(dirname "$FOUND_DIR")
              fi
            fi

            echo "📂 Target directory found: $TARGET_DIR"
            if [ -z "$TARGET_DIR" ] || [ ! -d "$TARGET_DIR" ]; then
              echo "❌ Error: Could not find xpharma repository on VPS!"
              exit 1
            fi

            cd "$TARGET_DIR"
            echo "📍 Working directory: $(pwd)"

            echo "📥 [2/4] Pulling latest updates from GitHub (main)..."
            git fetch origin main
            git reset --hard origin/main
            echo "✅ Latest commit: $(git log -1 --oneline)"

            echo "🗄️ [2.5/4] Synchronizing PostgreSQL database schemas and subscriptions..."
            sudo -u postgres psql -d xpharma_db -c "
              ALTER TABLE public.subscriptions DROP CONSTRAINT IF EXISTS subscriptions_plan_type_check;
              ALTER TABLE public.subscriptions DROP CONSTRAINT IF EXISTS subscriptions_status_check;
              ALTER TABLE public.subscriptions ALTER COLUMN tenant_id DROP NOT NULL;
              ALTER TABLE public.subscriptions ADD COLUMN IF NOT EXISTS user_id UUID REFERENCES public.users(id) ON DELETE SET NULL;
              ALTER TABLE public.subscriptions ADD COLUMN IF NOT EXISTS user_email VARCHAR(255);
              ALTER TABLE public.subscriptions ADD COLUMN IF NOT EXISTS user_name VARCHAR(255);
              ALTER TABLE public.subscriptions ADD COLUMN IF NOT EXISTS user_phone VARCHAR(64);
              ALTER TABLE public.subscriptions ADD COLUMN IF NOT EXISTS amount NUMERIC(10,2) DEFAULT 0;
              ALTER TABLE public.subscriptions ADD COLUMN IF NOT EXISTS currency VARCHAR(16) DEFAULT 'EGP';
              ALTER TABLE public.subscriptions ADD COLUMN IF NOT EXISTS payment_method VARCHAR(64) DEFAULT 'kashier';
              ALTER TABLE public.subscriptions ADD COLUMN IF NOT EXISTS order_id VARCHAR(128);
              ALTER TABLE public.subscriptions ADD COLUMN IF NOT EXISTS transaction_id VARCHAR(128);
              ALTER TABLE public.subscriptions ADD COLUMN IF NOT EXISTS card_brand VARCHAR(32);
              ALTER TABLE public.subscriptions ADD COLUMN IF NOT EXISTS masked_card VARCHAR(32);
              ALTER TABLE public.users ADD COLUMN IF NOT EXISTS is_subscription_active BOOLEAN DEFAULT TRUE;
              ALTER TABLE public.users ADD COLUMN IF NOT EXISTS subscription_plan INT DEFAULT 3;
              ALTER TABLE public.users ADD COLUMN IF NOT EXISTS subscription_expires_at TIMESTAMPTZ DEFAULT (NOW() + INTERVAL '30 days');
              UPDATE public.users SET is_subscription_active = TRUE, subscription_plan = GREATEST(COALESCE(subscription_plan, 0), 3) WHERE email IS NOT NULL;
              GRANT ALL ON TABLE public.subscriptions TO xpharma_user;
              GRANT ALL ON TABLE public.users TO xpharma_user;
              ALTER TABLE public.subscriptions OWNER TO xpharma_user;
              ALTER TABLE public.users OWNER TO xpharma_user;
            " 2>/dev/null || echo "Database sync step completed"

            echo "⚙️ [3/4] Updating Go Backend..."
            if [ -d "backend" ]; then
              cd backend
              if command -v go &> /dev/null; then
                go build -o /var/www/xpharma/xpharma-server cmd/server/main.go || echo "⚠️ go build failed"
                sudo systemctl restart xpharma-backend 2>/dev/null || systemctl restart xpharma-backend 2>/dev/null || true
                echo "✅ Backend service refreshed."
              else
                echo "⚠️ Go not found in PATH"
              fi
              cd ..
            fi

            echo "💻 [4/4] Building and updating Web Admin Dashboard (Next.js)..."
            if [ -d "web-admin" ]; then
              cd web-admin
              echo "Node version: $(node -v 2>/dev/null || echo 'not found')"
              echo "NPM version: $(npm -v 2>/dev/null || echo 'not found')"
              echo "📦 Installing dependencies..."
              npm install --prefer-offline --no-audit || npm install
              
              echo "🔨 Running Next.js build..."
              npm run build
              
              echo "🔄 Restarting web process in PM2..."
              export PORT=3002
              if command -v pm2 &> /dev/null; then
                pm2 list || true
                pm2 restart all --update-env || pm2 restart xpharma-web --update-env || pm2 restart xpharma-admin --update-env || PORT=3002 pm2 start npm --name "xpharma-web" -- start -- -p 3002
                pm2 save || true
                echo "✅ Web Admin restarted with PM2."
              else
                sudo systemctl restart xpharma-web 2>/dev/null || systemctl restart xpharma-web 2>/dev/null || true
              fi
              cd ..
            fi

            # Also ensure secondary directory is updated if it exists
            for OTHER_DIR in "/var/www/xpharma" "/var/www/xpharma/repo" "/root/xpharma"; do
              if [ -d "$OTHER_DIR/web-admin" ] && [ "$OTHER_DIR" != "$TARGET_DIR" ]; then
                echo "🔄 Syncing alternate directory: $OTHER_DIR"
                cd "$OTHER_DIR"
                git fetch origin main 2>/dev/null || true
                git reset --hard origin/main 2>/dev/null || true
                if [ -d "web-admin" ]; then
                  cd web-admin
                  npm run build 2>/dev/null || true
                fi
              fi
            done

            echo "🎉 Deployment completed successfully!"
