name: 🚀 XPharma Auto Deploy CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: 🌐 Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 [1/4] Starting XPharma deployment..."
            
            # Navigate to exact project directory on VPS
            if [ -d "/var/www/xpharma/repo" ]; then
              cd /var/www/xpharma/repo
            elif [ -d "/var/www/xpharma" ]; then
              cd /var/www/xpharma
            fi

            echo "📥 [2/4] Pulling latest code from GitHub (main)..."
            git fetch origin main
            git reset --hard origin/main

            echo "⚙️ [3/4] Building and restarting Go Backend..."
            if [ -d "backend" ]; then
              cd backend
              go build -o /var/www/xpharma/xpharma-server cmd/server/main.go
              sudo systemctl restart xpharma-backend
              echo "✅ Backend service restarted via systemd."
              cd ..
            fi

            echo "💻 [4/4] Building and updating Web Admin Dashboard (Next.js)..."
            if [ -d "web-admin" ]; then
              cd web-admin
              npm install --prefer-offline --no-audit || npm install
              npm run build
              pm2 restart xpharma-admin || pm2 restart all
              echo "✅ xpharma-admin restarted with PM2 on port 3002."
              cd ..
            fi

            echo "🎉 Deployment completed successfully!"
